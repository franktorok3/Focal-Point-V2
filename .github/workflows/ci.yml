name: Project Standard CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    uses: franktorok3/Project-Setup/.github/workflows/manifest.yml@main
  application:
    uses: franktorok3/Project-Setup/.github/workflows/next-ci.yml@main
    with:
      node-version: "24"
      require-lint: false
      require-build: true
      run-audit: true
      audit-blocking: false
